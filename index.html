<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Space Mono (brand/display: wordmark, section eyebrows, big numbers)
         + Literata (body: lesson prose, built for long-form reading -- see
         src/styles/theme.css for where each applies and why) + Kalam
         (handwritten accent face, used sparingly for notebook-style
         annotations -- see src/styles/notebook.css, scoped to `.nb-theme`
         pages only, not loaded-but-unused like the Inter incident that
         comment documents). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;0,7..72,700;1,7..72,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <title>Learn AI by building it, free — Neural Mastery AI</title>
    <!-- Static fallback for crawlers that don't execute JS (this is a
         client-side SPA -- useDocumentMeta overwrites these per-route once
         React hydrates, for crawlers that do execute JS). -->
    <meta name="description" content="Free lessons on AI from the maths up to LLMs and agents, plus coding problems you run in your browser against real tests. No sign-up, nothing to install." />
    <meta property="og:title" content="Learn AI by building it, free — Neural Mastery AI" />
    <meta property="og:description" content="Free lessons on AI from the maths up to LLMs and agents, plus coding problems you run in your browser against real tests. No sign-up, nothing to install." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://neuralmasteryai.com/" />
    <meta property="og:site_name" content="Neural Mastery AI" />
    <meta property="og:image" content="https://neuralmasteryai.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Learn AI by building it, free — Neural Mastery AI" />
    <meta name="twitter:description" content="Free lessons on AI from the maths up to LLMs and agents, plus coding problems you run in your browser against real tests. No sign-up, nothing to install." />
    <meta name="twitter:image" content="https://neuralmasteryai.com/og-image.png" />
    <!-- Tells search engines the site's name and the spellings people use
         for it, so brand searches ("neuralmastery", "neural mastery ai")
         resolve to this site. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://neuralmasteryai.com/#website",
            "name": "Neural Mastery AI",
            "alternateName": ["Neural Mastery", "NeuralMastery", "NeuralMasteryAI", "neuralmasteryai.com"],
            "url": "https://neuralmasteryai.com/",
            "description": "Free lessons on AI from the maths up to LLMs and agents, plus coding problems you run in your browser against real tests.",
            "inLanguage": "en",
            "publisher": { "@id": "https://neuralmasteryai.com/#organization" }
          },
          {
            "@type": ["Organization", "EducationalOrganization"],
            "@id": "https://neuralmasteryai.com/#organization",
            "name": "Neural Mastery AI",
            "alternateName": "Neural Mastery",
            "url": "https://neuralmasteryai.com/",
            "logo": "https://neuralmasteryai.com/og-image.png",
            "sameAs": ["https://x.com/NeuralMastery"]
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Cloudflare Web Analytics: cookieless visit counts (see PrivacyPolicyPage).
         Production host only: elsewhere (localhost, CI) Cloudflare rejects the
         report with a CORS error, which the smoke tests rightly flag. -->
    <script>
      if (location.hostname === 'neuralmasteryai.com') {
        var cf = document.createElement('script');
        cf.defer = true;
        cf.src = 'https://static.cloudflareinsights.com/beacon.min.js';
        cf.setAttribute('data-cf-beacon', '{"token": "2ee8fe49276648fd98c179dcd7932adc"}');
        document.body.appendChild(cf);
      }
    </script>
  </body>
</html>
