<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Neural Mastery Interview Room</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one calm interview room. The question and your live words hold the screen; no hints or lists. */
:root{
  --bg:#faf4e6;--surface:#fffdf7;--line:#d8c9a3;--fg:#1c2230;--soft:#4f5563;
  --accent:#1d4fc4;--accent-fill:#e3ebfd;--on-accent:#ffffff;
  --good:#1b7856;--good-fill:#e2f5ea;--warn:#935e06;--warn-fill:#fbecce;--bad:#be3b2d;--bad-fill:#fbe4e0;
  --display:'Fraunces',Georgia,serif;--body:'Source Sans 3',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141820;--surface:#1c2230;--line:#39414f;--fg:#f2ecdc;--soft:#b5b9c2;
  --accent:#8fb0ff;--accent-fill:#22325a;--on-accent:#101522;
  --good:#6fd3a8;--good-fill:#17372b;--warn:#e7b65c;--warn-fill:#3b2e12;--bad:#f39a8e;--bad-fill:#40201c;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141820;--surface:#1c2230;--line:#39414f;--fg:#f2ecdc;--soft:#b5b9c2;
  --accent:#8fb0ff;--accent-fill:#22325a;--on-accent:#101522;
  --good:#6fd3a8;--good-fill:#17372b;--warn:#e7b65c;--warn-fill:#3b2e12;--bad:#f39a8e;--bad-fill:#40201c;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:400 17px/1.55 var(--body)}
.wrap{max-width:780px;margin:0 auto;padding:20px 16px 56px;display:flex;flex-direction:column;gap:20px}
.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline;font:500 13px var(--mono);color:var(--soft)}
.note{font-size:14px;color:var(--soft);border-left:3px solid var(--line);padding-left:10px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}
h1{font-size:clamp(28px,6vw,40px);line-height:1.15}
h2{font-size:clamp(23px,4.6vw,31px);line-height:1.22}
h3{font-size:19px}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:15px}
select{font:inherit;padding:10px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px}
button{font:600 16px var(--body);padding:12px 20px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.who{font:500 13px var(--mono);color:var(--soft);display:flex;align-items:center;gap:8px;min-height:22px}
.bars{display:inline-flex;gap:3px;align-items:center;height:18px}
.bars i{width:4px;height:6px;background:var(--accent);border-radius:2px}
.on .bars i{animation:b 900ms ease-in-out infinite}
.bars i:nth-child(2){animation-delay:.15s}.bars i:nth-child(3){animation-delay:.3s}.bars i:nth-child(4){animation-delay:.45s}
@keyframes b{50%{height:18px}}
.live{min-height:150px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;font-size:18px}
.live .fresh{color:var(--soft)}
.caret{display:inline-block;width:2px;height:1em;background:var(--accent);vertical-align:-2px;margin-left:2px;animation:c 1s steps(2) infinite}
@keyframes c{50%{opacity:0}}
.clock{font-variant-numeric:tabular-nums}
.call{background:var(--warn-fill);color:var(--fg);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:6px}
.call strong{font:600 26px var(--display)}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:128px minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.row b{font-weight:700}
.pill{justify-self:start;align-self:start;font:500 12px var(--mono);padding:3px 8px;border-radius:4px}
.strong{background:var(--good-fill);color:var(--good)}.ok{background:var(--warn-fill);color:var(--warn)}.gap{background:var(--bad-fill);color:var(--bad)}
blockquote{margin:6px 0 0;padding-left:10px;border-left:2px solid var(--line);color:var(--soft);font-size:15px}
mark{background:var(--good-fill);color:inherit;padding:0 2px}
mark.w{background:var(--warn-fill)}
.next{background:var(--accent-fill);border-radius:8px;padding:16px}
@media (max-width:480px){.row{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){.bars i,.caret{animation:none}}
</style>
<div class="wrap">
  <div class="top"><span>Neural Mastery · Interview</span><span id="progress"></span></div>
  <main id="room" class="stack" aria-live="polite"></main>
  <p class="note" id="foot">Mock-up with scripted content. The microphone step is simulated. The first answer is your real one; your replies are played back, not recorded. The scorecard is hand-written to show the format, not produced by a model.</p>
</div>
<script>
const room=document.getElementById('room'),progress=document.getElementById('progress');
const yours="A foundational model is a probabilistic model based upon the previous tokens. It tries to predict the next token. Regular ML models are trained on structured data, where they learn the patterns, whereas foundational models, which are large language models, predict the next tokens based on the previous tokens and are trained on large data. Coming to the trade-offs, ML models are really cheaper because the size is very less. They can run on the CPU. Foundational models sometimes need a GPU and involve token cost. For simple tasks with structured data and defined patterns, ML models are preferred. If we need context and understanding, foundational models are a better choice.";
const steps=[
 {tag:'Question 1 of 4',q:"What is a foundation model, and how is it different from a regular ML model?",a:yours,who:'Your answer'},
 {tag:'Follow-up',q:"You described predicting tokens. Why can one foundation model serve many different tasks, when a regular model usually does one?",a:"Because it is pretrained on very broad data, so it learns general patterns. Then we can use it for different tasks with prompting, or with fine-tuning, instead of training a new model every time.",who:'Sample reply'},
 {tag:'Follow-up',q:"Good. When would you still train a task-specific model instead?",a:"When the task is narrow and we have good labelled data, or when latency and cost matter a lot. A small model can be cheaper and easier to test.",who:'Sample reply'}
];
let timer=null;
const stopAll=()=>{clearInterval(timer);try{speechSynthesis.cancel()}catch(e){}};
function setup(){
  stopAll();progress.textContent='';
  room.innerHTML=`<h1>Practise the real thing.</h1>
  <p>The interviewer asks out loud. You answer out loud. You get the debrief at the end, as you would after a real round.</p>
  <div class="fields"><label for="track">Track<select id="track"><option>GenAI Engineer</option><option>ML Engineer</option><option>Data Scientist</option><option>MLOps Engineer</option></select></label>
  <label for="level">Level<select id="level"><option>Mid-level (2–5 years)</option><option>Junior</option><option>Senior</option></select></label>
  <label for="length">Length<select id="length"><option>20 minutes, 4 questions</option><option>10 minutes, 2 questions</option></select></label></div>
  <div class="actions"><button class="primary" id="begin">Start the interview</button></div>`;
  document.getElementById('begin').onclick=micStep;
}
function micStep(){
  stopAll();
  room.innerHTML=`<h2>Allow your microphone</h2><p>You only do this once. After that the interview runs by voice, with nothing to click while you answer.</p>
  <div class="actions"><button class="primary" id="mic">Enable microphone and begin</button></div>`;
  document.getElementById('mic').onclick=()=>ask(0);
}
function reveal(i){return `<div><button id="show">Repeat the question as text</button><p id="qtext" hidden style="margin-top:10px">${steps[i].q}</p></div>`}
function bindReveal(){document.getElementById('show').onclick=()=>{document.getElementById('qtext').hidden=false;document.getElementById('show').hidden=true}}
function ask(i){
  stopAll();const s=steps[i];progress.textContent=s.tag;
  room.innerHTML=`<div class="who on"><span class="bars"><i></i><i></i><i></i><i></i></span><span>Interviewer is speaking</span></div>${reveal(i)}`;
  bindReveal();
  let moved=false;const go=()=>{if(!moved&&progress.textContent===s.tag){moved=true;listen(i)}};
  try{const u=new SpeechSynthesisUtterance(s.q);u.lang='en-IN';u.rate=.98;u.onend=go;u.onerror=go;speechSynthesis.speak(u);}catch(e){go()}
  setTimeout(go,Math.max(4000,s.q.split(' ').length*520));
}
function listen(i){
  stopAll();const s=steps[i],words=s.a.split(' ');let n=0,secs=0;
  room.innerHTML=`<div class="who on"><span class="bars"><i></i><i></i><i></i><i></i></span><span>Listening · <span class="clock" id="clock">0:00</span> · ${s.who}</span></div>
  <div class="live" id="live"><span class="caret"></span></div>${reveal(i)}
  <p class="note" id="end">When you stop talking for a few seconds, the interviewer continues.</p>
  <div class="actions"><button id="done">Skip ahead</button></div>`;
  bindReveal();
  const live=document.getElementById('live'),clock=document.getElementById('clock');
  const go=()=>{clearInterval(timer);i+1<steps.length?ask(i+1):card()};
  document.getElementById('done').onclick=go;
  const speed=matchMedia('(prefers-reduced-motion:reduce)').matches?1:140;
  timer=setInterval(()=>{n++;secs+=.37;
    if(n>words.length){clearInterval(timer);setTimeout(()=>{if(document.getElementById('live')===live)go()},1800);return}
    const settled=words.slice(0,Math.max(0,n-3)).join(' '),fresh=words.slice(Math.max(0,n-3),n).join(' ');
    live.innerHTML=`${settled} <span class="fresh">${fresh}</span><span class="caret"></span>`;
    clock.textContent=`${Math.floor(secs/60)}:${String(Math.floor(secs%60)).padStart(2,'0')}`;
  },speed);
}
function row(label,pill,cls,text,quote){return `<div class="row"><div class="stack" style="gap:6px"><b>${label}</b><span class="pill ${cls}">${pill}</span></div><div><p>${text}</p>${quote?`<blockquote>${quote}</blockquote>`:''}</div></div>`}
function card(){
  stopAll();progress.textContent='Debrief · GenAI Engineer, mid-level';
  room.innerHTML=`<div class="call"><span style="font:500 13px var(--mono)">Interviewer's call on this question</span><strong>Getting there</strong><p>You reasoned well about when to use each model, but opened with a definition of an LLM, not a foundation model. The key idea came out only after a prompt.</p></div>
  <div class="next"><h3>Practise this next</h3><p style="margin-top:6px">Open with one sentence: "One large model, pretrained on broad data, that you adapt to many tasks." Then give your trade-offs.</p><div class="actions" style="margin-top:12px"><button class="primary" id="again">Answer it again</button></div></div>
  <div class="rows">
  ${row('Fundamentals','Partly there','ok','You described next-token prediction, which is how LLMs work. A foundation model is defined by being reused across tasks, and you missed that at first.','"A foundational model is a probabilistic model based upon the previous tokens."')}
  ${row('Depth when probed','Solid','strong','When asked, you explained broad pretraining and adapting by prompting or fine-tuning.','"...we can use it for different tasks with prompting, or with fine-tuning..."')}
  ${row('Trade-offs','Strong','strong','Your best part. Cost, hardware and when simple ML is enough are what interviewers look for at this level.','"For simple tasks with structured data and defined patterns, ML models are preferred."')}
  ${row('Communication','Needs work','gap','The answer took time to reach its point and repeated "previous tokens" three times. Lead with the answer first.','')}
  </div>
  <div class="stack"><h3>Your answer, marked</h3><p class="live" style="min-height:0"><mark class="w">A foundational model is a probabilistic model based upon the previous tokens.</mark> It tries to predict the next token. Regular ML models are trained on structured data... <mark>ML models are really cheaper because the size is very less. They can run on the CPU. Foundational models sometimes need a GPU and involve token cost. For simple tasks with structured data and defined patterns, ML models are preferred.</mark></p><p class="note">Green: strong evidence. Amber: recheck this.</p></div>
  <div class="actions"><button id="restart">Start over</button></div>`;
  document.getElementById('again').onclick=()=>ask(0);document.getElementById('restart').onclick=setup;
}
setup();
</script>

</body></html>
