name: Deploy platform-vite to GitHub Pages

# Automatic deployment promotes the artifact from a successful main-push CI
# run, including unit tests, without rebuilding. Manual dispatch deliberately
# bypasses CI and builds the selected dispatch SHA as an owner override.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  # Browser inference uses onnxruntime-web; CI needs no Node CUDA providers.
  # Keep both flags: kokoro-js pins ORT 1.21 (CUDA flag only), while
  # Transformers uses ORT 1.30 (new install flag). CPU bindings stay bundled.
  ONNXRUNTIME_NODE_INSTALL: 'skip'
  ONNXRUNTIME_NODE_INSTALL_CUDA: 'skip'

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  promote:
    if: >-
      github.event_name == 'workflow_run' &&
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact CI-tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Download the Pages tar from this specific CI run, never a latest-run
      # lookup. Re-upload unchanged into this run for deploy-pages to consume.
      - name: Download tested Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: ci-pages
          path: tested-pages
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote tested Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: tested-pages/artifact.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  manual-build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Only the manual build needs Chromium for Pagefind prerendering.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - name: Checkout manually selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build (dist/, not Docusaurus's build/)
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Generate Pagefind index
        run: npm run pagefind

      - name: Validate static output before deploying
        run: |
          test -f dist/index.html || (echo "::error::dist/index.html missing" && exit 1)
          test -f dist/404.html || (echo "::error::dist/404.html missing" && exit 1)
          test -f dist/pagefind/pagefind.js || (echo "::error::Pagefind output missing" && exit 1)

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Only eligible deploy jobs enter this queue. A failed CI completion must
    # never replace a valid pending deployment before its job guards run.
    concurrency:
      group: pages-vite
      cancel-in-progress: false
      queue: max
    needs: [promote, manual-build]
    if: >-
      always() && !cancelled() &&
      (needs.promote.result == 'success' || needs.manual-build.result == 'success')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Check after acquiring the deployment slot: an older successful CI may
      # finish or leave the queue after a newer main commit. Manual dispatch
      # intentionally retains its selected-SHA override.
      - name: Check automatic deployment is still current
        id: current
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('deploy', 'true');
              return;
            }
            const { data: main } = await github.rest.repos.getBranch({
              ...context.repo,
              branch: 'main',
            });
            const testedSha = context.payload.workflow_run.head_sha;
            const current = main.commit.sha === testedSha;
            core.setOutput('deploy', String(current));
            if (!current) core.notice(`Skipping stale CI commit ${testedSha}; main is ${main.commit.sha}`);

      - id: deployment
        if: steps.current.outputs.deploy == 'true'
        uses: actions/deploy-pages@v4
