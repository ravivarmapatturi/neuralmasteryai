name: Deploy platform-vite to GitHub Pages

# Deploys on every push to main, plus workflow_dispatch for an ad-hoc
# manual redeploy (e.g. a Pagefind-index-only refresh with no new commit).
#
# This repo (ravivarmapatturi/NeuralMastery-vite) is its own standalone
# repository, separate from the existing Docusaurus production site's repo
# (ravivarmapatturi/NeuralMastery) -- so each has its own independent
# `github-pages` Actions environment, and deploying this one cannot collide
# with or overwrite the other.
#
# Previously gated behind a manual trigger only, during the content-migration
# period: verification in practice has always happened against the live URL
# AFTER deploying, not by inspecting a build before triggering it, so the
# manual gate wasn't actually preventing broken content from going live --
# it was just added latency. The real correctness gating is ci.yml (162 unit
# tests, typecheck, link-checking) plus this workflow's own build job, which
# independently re-runs typecheck + build + output-validation before ever
# deploying, so removing the manual gate removes a redundant click, not a
# safety check.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-vite
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # See ci.yml's matching comment: Playwright's own image ships Chromium's
    # OS-level dependencies pre-installed, so no apt-based `playwright
    # install --with-deps` step is needed (that step was taking 15+ minutes
    # per run). Tag must track the installed @playwright/test version.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build (dist/, not Docusaurus's build/)
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Generate Pagefind index
        run: npm run pagefind

      - name: Validate static output before deploying
        run: |
          test -f dist/index.html || (echo "::error::dist/index.html missing" && exit 1)
          test -f dist/404.html || (echo "::error::dist/404.html missing" && exit 1)
          test -f dist/pagefind/pagefind.js || (echo "::error::Pagefind output missing" && exit 1)

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
