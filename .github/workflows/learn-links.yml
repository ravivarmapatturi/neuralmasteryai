name: Interview learn links
on:
  push:
    branches: [learn-links]
  workflow_dispatch:
env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: 'skip'
jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: node scripts/interview-learn-links.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: learn-links
          path: src/data/interviewLearnLinks.json
