name: Speech eval
on:
  push:
    branches: [speech-eval]
env:
  ONNXRUNTIME_NODE_INSTALL: 'skip'
  ONNXRUNTIME_NODE_INSTALL_CUDA: 'skip'
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: v2-base-one-term, args: '--only=whisper-base-wasm --set=v2 --prompt=wide --promptText=BM25.' }
          - { name: v2-base-four-terms, args: '--only=whisper-base-wasm --set=v2 --prompt=wide --promptText=RAG,BM25,embeddings,reranker.' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: node scripts/speech-accuracy/evaluate-tiers.mjs ${{ matrix.args }} --name=${{ matrix.name }} --repeat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tier-${{ matrix.name }}
          path: scripts/speech-accuracy/tier-${{ matrix.name }}.json
