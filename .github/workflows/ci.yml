name: CI

# Validates platform-vite on every PR and every push to main. This workflow
# never deploys anything -- see deploy.yml (manual-only) for that.
#
# Repository: ravivarmapatturi/NeuralMastery-vite, its own standalone repo
# (root of this repo == root of platform-vite), separate from the existing
# Docusaurus site's ravivarmapatturi/NeuralMastery repository -- so no
# working-directory or path filters are needed here.
on:
  pull_request:
  push:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  unit-tests:
    name: vitest unit tests
    runs-on: ubuntu-latest
    # Deliberately its own job, not a step tacked onto `ci` below: these are
    # plain jsdom/node tests with no Playwright browser or MDX build
    # involved, so a bare ubuntu-latest runner (no container image) is both
    # correct and fast -- keeping it separate means it starts immediately in
    # parallel with the heavier build+Playwright job instead of queuing
    # behind it.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (deterministic)
        run: npm ci

      - name: Vitest unit tests
        run: npm run test:unit

  ci:
    name: typecheck, build, pagefind, link-check, smoke tests
    runs-on: ubuntu-latest
    # Runs inside Playwright's own image (Chromium + every OS-level .so
    # dependency already installed) instead of `npx playwright install
    # --with-deps` / `install-deps` on a bare ubuntu-latest runner. That
    # apt-based install refreshes every configured repo on the runner
    # (Azure CLI, MS packages, Google Chrome, Ubuntu's own mirrors) on
    # EVERY run, cache hit or not -- actions/cache only persists the browser
    # binary itself (~/.cache/ms-playwright), never the system libraries
    # apt installs, which don't survive between ephemeral runner VMs. That
    # single step was taking 15+ minutes even when the binary was cached.
    # Tag must track the installed @playwright/test version exactly (see
    # package.json) -- image tags are per Playwright version + Ubuntu
    # codename (noble = 24.04, matching ubuntu-latest as of this pin).
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (deterministic)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Validate static build output
        run: |
          test -f dist/index.html || (echo "::error::dist/index.html missing" && exit 1)
          test -f dist/404.html || (echo "::error::dist/404.html missing (GitHub Pages deep-link fallback)" && exit 1)
          test -d dist/assets || (echo "::error::dist/assets missing" && exit 1)
          echo "dist/ output validated: index.html, 404.html, assets/ present."

      - name: Internal link validation
        run: npm run check:links

      - name: Generate Pagefind index
        run: npm run pagefind

      - name: Validate Pagefind output
        run: |
          test -f dist/pagefind/pagefind.js || (echo "::error::dist/pagefind/pagefind.js missing" && exit 1)
          echo "Pagefind output validated."

      - name: Playwright smoke tests
        run: npm run test:smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
